<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Archivist's Bookcase</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;
  width:100%;max-width:100%;
  overflow-x:hidden;
}
body{
  min-height:100vh;
  color:#d9c58f;
  font-family:Georgia,'Times New Roman',serif;
  background:#0a0705;
  user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- Top bar ---------- */
.topbar{
  position:relative;z-index:5;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) 10px 14px;
  text-align:center;
}
h1{font-size:18px;margin:0;letter-spacing:2px;font-weight:normal;
   text-shadow:0 0 12px #c9832f88,0 2px 6px #000}
.sub{font-size:11px;opacity:.75;margin:4px 0 8px;font-style:italic;
     text-shadow:0 1px 4px #000}
.hud{display:flex;gap:12px;align-items:center;font-size:12px;
     flex-wrap:wrap;justify-content:center}
.tray{display:flex;gap:6px}
.slot{width:34px;height:34px;border:1px solid #6b4a25;border-radius:6px;
      background:#1a110acc;display:grid;place-items:center;opacity:.9}
.slot svg{width:26px;height:26px;filter:brightness(.25) grayscale(1);transition:.6s}
.slot.on{border-color:#c9a24b;box-shadow:0 0 12px #c9a24b99}
.slot.on svg{filter:none}
button{font:inherit;color:#d9c58f;background:#2a1a0dcc;border:1px solid #7a5a2d;
       border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px}
button:disabled{opacity:.5;cursor:default}

/* ---------- Stage ---------- */
.stage{
  position:relative;
  width:100%;
  max-width:100%;
  line-height:0;
}
.bg-full{
  display:block;
  width:100%;
  max-width:100%;
  height:auto;
  margin:0;
  transform:translate(var(--bgx,0px),var(--bgy,0px));
  will-change:transform;
}
.board{
  position:absolute;
  top:0;left:50%;
  z-index:3;
  touch-action:none;
  line-height:normal;
  transform:translateX(-50%)
            translate(var(--px,0px),var(--py,0px))
            scale(var(--psx,1),var(--psy,1));
  transform-origin:top center;
  will-change:transform;
}

.pc{position:absolute;left:0;top:0;display:grid;place-items:center;z-index:1;
    transition:opacity .8s}
.pc svg{width:80%;height:80%}
.pc.got svg{animation:sh .9s ease-out forwards}
.pc.gone{opacity:0}
@keyframes sh{0%{filter:drop-shadow(0 0 0 #ffd86b)}40%{filter:drop-shadow(0 0 14px #ffd86b);transform:scale(1.25)}100%{filter:drop-shadow(0 0 6px #ffd86b);transform:scale(1)}}

.blk{position:absolute;left:0;top:0;display:flex;z-index:2;cursor:grab;
     border-radius:3px;box-shadow:0 4px 10px #000a,0 0 0 1px #0009;
     transition:transform .16s ease-out,filter .15s;overflow:hidden}
.blk:hover{filter:brightness(1.15)}
.blk.drag{transition:none;z-index:5;cursor:grabbing;filter:brightness(1.25)}
.blk img{display:block;width:100%;height:100%;object-fit:fill;
         pointer-events:none;-webkit-user-drag:none;user-select:none;
         -webkit-touch-callout:none}

#win{position:fixed;inset:0;background:#000c;display:none;place-items:center;
     z-index:20;text-align:center;padding:20px}
#win div{max-width:320px;padding:26px;border:1px solid #c9a24b;border-radius:10px;
         background:#1d130b;box-shadow:0 0 40px #c9a24b55}
#win h2{margin:0 0 8px;font-weight:normal;color:#ffd86b;font-size:20px}
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="br" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f3d98a"/><stop offset=".5" stop-color="#b8862e"/>
<stop offset="1" stop-color="#6e4a14"/></linearGradient></defs></svg>

<div class="topbar">
  <h1>THE ARCHIVIST'S BOOKCASE</h1>
  <div class="sub">Slide the book groups aside. Something brass is hidden behind them.</div>
  <div class="hud">
    <div class="tray" id="tray"></div>
    <div>Moves <b id="mv">0</b> · Par 22</div>
    <button id="rs">Reset</button>
    <button id="as">Auto Solve</button>
  </div>
</div>

<div class="stage">
  <img class="bg-full" src="bookpuzzlebackground.png" alt="">
  <div class="board" id="bd"></div>
</div>

<div id="win"><div><h2>The scale is whole</h2><p id="wt"></p>
<button onclick="init()">Shelve it again</button></div></div>

<script>
/* =====================================================================
   ADJUST THESE VALUES
   ---------------------------------------------------------------------
   BG_X / BG_Y   : nudge the background image left/right/up/down, in px.
                   Leave at 0 — the image already fills the width.
   PUZZLE_X / Y  : nudge the whole puzzle, in px.
   PUZZLE_SCALE_X / PUZZLE_SCALE_Y :
                   Stretch the WHOLE puzzle — blocks and positions grow
                   together as one. 1 = natural size.
   ===================================================================== */
const CONFIG = {
  BG_X: 0,
  BG_Y: 0,
  PUZZLE_X: 10,
  PUZZLE_Y: 80,
  PUZZLE_SCALE_X: 1.40,
  PUZZLE_SCALE_Y: 0.85,
};

/* ---------- Game data ---------- */
const B=[[1,2,0,1],[1,3,0,2],[1,3,0,3],[1,3,1,0],[1,3,2,1],[1,1,3,2],[1,3,3,3],[1,1,4,0],[2,1,5,0],[1,3,5,2],[2,2,6,0],[1,3,6,3],[1,2,8,0],[1,2,8,1],[1,1,9,2],[1,1,9,3]];
const T=[[7,2,'beam'],[6,3,'pan'],[2,1,'weight']];
const IC={
beam:'<path d="M4 14h32M20 14v16M13 31h14" stroke="url(#br)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="14" r="4.5" fill="url(#br)"/><circle cx="4" cy="16" r="2.5" fill="url(#br)"/><circle cx="36" cy="16" r="2.5" fill="url(#br)"/>',
pan:'<path d="M20 4L7 22M20 4l13 18" stroke="url(#br)" stroke-width="2" fill="none"/><path d="M5 22h30c0 8-6 13-15 13S5 30 5 22z" fill="url(#br)"/>',
weight:'<circle cx="20" cy="9" r="4.5" stroke="url(#br)" stroke-width="2.5" fill="none"/><path d="M14 14h12l6 21H8z" fill="url(#br)"/>'};
const svg=k=>`<svg viewBox="0 0 40 40">${IC[k]}</svg>`;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let s,pos,moves,got,els,pcs,drag=null;
let solving=false, solveGen=0;

function applyConfig(){
  const r=document.documentElement.style;
  r.setProperty('--bgx', CONFIG.BG_X+'px');
  r.setProperty('--bgy', CONFIG.BG_Y+'px');
  r.setProperty('--px',  CONFIG.PUZZLE_X+'px');
  r.setProperty('--py',  CONFIG.PUZZLE_Y+'px');
  r.setProperty('--psx', CONFIG.PUZZLE_SCALE_X);
  r.setProperty('--psy', CONFIG.PUZZLE_SCALE_Y);
}

/* ---------- Solver ---------- */
function buildGrid(p){
  const g=Array.from({length:10},()=>Array(4).fill(-1));
  for(let i=0;i<B.length;i++){
    const w=B[i][0],h=B[i][1],r0=p[i][0],c0=p[i][1];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++) g[r0+y][c0+x]=i;
  }
  return g;
}
function keyFromPos(p){
  let s='';
  for(let i=0;i<p.length;i++) s+=String.fromCharCode(32+p[i][0]*4+p[i][1]);
  return s;
}
function posFromKey(k){
  const p=[];
  for(let i=0;i<k.length;i++){
    const v=k.charCodeAt(i)-32;
    p.push([Math.floor(v/4),v%4]);
  }
  return p;
}
function solve(startPos,tr,tc,maxStates=400000){
  const startKey=keyFromPos(startPos);
  const visited=new Set([startKey]);
  const keys=[startKey];
  const parents=[-1];
  const moveInfos=[null];
  let head=0;
  while(head<keys.length && keys.length<maxStates){
    const k=keys[head];
    const p=posFromKey(k);
    const g=buildGrid(p);
    for(let i=0;i<B.length;i++){
      const w=B[i][0],h=B[i][1];
      const r0=p[i][0],c0=p[i][1];
      const iCovers = tr>=r0 && tr<r0+h && tc>=c0 && tc<c0+w;
      const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
      for(let d=0;d<4;d++){
        const dr=dirs[d][0], dc=dirs[d][1];
        let r=r0, c=c0;
        for(let dist=1;;dist++){
          r+=dr; c+=dc;
          if(r<0||c<0||r+h>10||c+w>4) break;
          let ok=true;
          for(let y=0;y<h&&ok;y++){
            for(let x=0;x<w;x++){
              const cell=g[r+y][c+x];
              if(cell!==-1 && cell!==i){ok=false;break}
            }
          }
          if(!ok) break;
          const nk = k.substring(0,i) + String.fromCharCode(32+r*4+c) + k.substring(i+1);
          if(visited.has(nk)) continue;
          visited.add(nk);
          keys.push(nk);
          parents.push(head);
          moveInfos.push({i,dr,dc,dist});
          const newCovers = tr>=r && tr<r+h && tc>=c && tc<c+w;
          if(iCovers && !newCovers){
            const path=[];
            let cur=keys.length-1;
            while(parents[cur]!==-1){
              path.unshift(moveInfos[cur]);
              cur=parents[cur];
            }
            return path;
          }
        }
      }
    }
    head++;
  }
  return null;
}

/* ---------- Layout / rendering ---------- */
function occ(ex){const g=Array.from({length:10},()=>Array(4).fill(-1));B.forEach((b,i)=>{if(i==ex)return;for(let y=0;y<b[1];y++)for(let x=0;x<b[0];x++)g[pos[i][0]+y][pos[i][1]+x]=i});return g}
function free(i,dr,dc){const g=occ(i),[w,h]=B[i];let[r,c]=pos[i],k=0;for(;;){r+=dr;c+=dc;if(r<0||c<0||r+h>10||c+w>4)break;let ok=1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(g[r+y][c+x]>=0)ok=0;if(!ok)break;k++}return k}
function place(i,ox=0,oy=0){els[i].style.transform=`translate(${pos[i][1]*s+2+ox}px,${pos[i][0]*s+2+oy}px)`}
function layout(){
  const availW = innerWidth  - 30;
  const availH = innerHeight - 190;
  s = Math.max(28, Math.min(96, Math.floor(availW/4), Math.floor(availH/10)));
  const bd=$('bd');
  bd.style.width  = 4*s + 'px';
  bd.style.height = 10*s + 'px';
  B.forEach((b,i)=>{const e=els[i];e.style.width=b[0]*s-4+'px';e.style.height=b[1]*s-4+'px';place(i)});
  T.forEach((t,k)=>{const e=pcs[k];e.style.width=e.style.height=s+'px';e.style.transform=`translate(${t[1]*s}px,${t[0]*s}px)`});
}

function init(){
  solveGen++; solving=false; drag=null;
  const bd=$('bd'); bd.innerHTML=''; $('win').style.display='none';
  pos=B.map(b=>[b[2],b[3]]);moves=0;got=[0,0,0];$('mv').textContent=0;els=[];pcs=[];
  $('tray').innerHTML=T.map((t,k)=>`<div class="slot" id="s${k}">${svg(t[2])}</div>`).join('');
  T.forEach(t=>{const e=document.createElement('div');e.className='pc';e.innerHTML=svg(t[2]);bd.appendChild(e);pcs.push(e)});
  B.forEach((b,i)=>{
    const e=document.createElement('div');e.className='blk';e.dataset.i=i;
    const im=new Image();
    im.src='block'+(i+1)+'.png';
    im.alt='';im.draggable=false;
    e.appendChild(im);
    bd.appendChild(e);els.push(e);
  });
  const btn=$('as'); btn.disabled=false; btn.textContent='Auto Solve';
  layout();
}

function check(){
  T.forEach((t,k)=>{
    if(got[k])return;
    if(occ(-1)[t[0]][t[1]]<0){
      got[k]=1;
      pcs[k].classList.add('got');
      $('s'+k).classList.add('on');
      setTimeout(()=>pcs[k].classList.add('gone'),1200);
    }
  });
  if(got.every(Boolean)) setTimeout(()=>{
    $('wt').textContent=`Beam, pan and counterweight recovered in ${moves} moves (par 22).`;
    $('win').style.display='grid';
  },1400);
}

async function doMoveAsync(m){
  const {i,dr,dc,dist}=m;
  const e=els[i];
  const nr=pos[i][0]+dr*dist;
  const nc=pos[i][1]+dc*dist;
  e.style.transform=`translate(${nc*s+2}px,${nr*s+2}px)`;
  await sleep(180);
  pos[i][0]=nr; pos[i][1]=nc;
  moves++; $('mv').textContent=moves;
}
async function autoSolve(){
  if(solving) return;
  const next=got.indexOf(0);
  if(next===-1) return;
  solving=true;
  const myGen=solveGen;
  const btn=$('as');
  btn.disabled=true; btn.textContent='Solving…';
  drag=null;
  try{
    const [tr,tc]=T[next];
    await sleep(20);
    if(solveGen!==myGen) return;
    const path=solve(pos,tr,tc);
    if(solveGen!==myGen) return;
    if(!path){ btn.textContent='No solution'; await sleep(1500); return; }
    if(path.length===0){ check(); await sleep(1500); return; }
    for(const m of path){
      if(solveGen!==myGen) return;
      await doMoveAsync(m);
    }
    if(solveGen!==myGen) return;
    check();
    await sleep(1500);
  } finally {
    if(solveGen===myGen){
      solving=false;
      btn.disabled=false;
      btn.textContent='Auto Solve';
    }
  }
}

const bd=$('bd');
bd.addEventListener('pointerdown',e=>{
  if(solving) return;
  const el=e.target.closest('.blk'); if(!el) return;
  const i=+el.dataset.i;
  const effX = s * CONFIG.PUZZLE_SCALE_X;
  const effY = s * CONFIG.PUZZLE_SCALE_Y;
  drag={i, sx:e.clientX, sy:e.clientY, ax:null, off:0,
        l:free(i,0,-1)*effX, r:free(i,0,1)*effX,
        u:free(i,-1,0)*effY, d:free(i,1,0)*effY};
  el.classList.add('drag');
  bd.setPointerCapture(e.pointerId);
});
bd.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.ax && Math.max(Math.abs(dx),Math.abs(dy))>5) drag.ax=Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(!drag.ax) return;
  const v=drag.ax==='x'?dx:dy;
  const lo=-(drag.ax==='x'?drag.l:drag.u), hi=(drag.ax==='x'?drag.r:drag.d);
  drag.off=Math.max(lo,Math.min(hi,v));
  drag.ax==='x'?place(drag.i,drag.off,0):place(drag.i,0,drag.off);
});
function end(){
  if(!drag) return;
  const{i,ax,off}=drag; els[i].classList.remove('drag'); drag=null;
  if(!ax) return;
  const cellPx = ax==='x' ? s*CONFIG.PUZZLE_SCALE_X : s*CONFIG.PUZZLE_SCALE_Y;
  const n=Math.round(off/cellPx);
  if(n){ ax==='x'?pos[i][1]+=n:pos[i][0]+=n; moves++; $('mv').textContent=moves; }
  place(i);
  if(n) check();
}
bd.addEventListener('pointerup',end);
bd.addEventListener('pointercancel',end);

$('rs').onclick=init;
$('as').onclick=autoSolve;

let lastW=innerWidth, resizeTimer;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(innerWidth===lastW) return;
    lastW=innerWidth;
    if(els) layout();
  },150);
}
addEventListener('resize',onResize);
addEventListener('orientationchange',()=>{
  setTimeout(()=>{ lastW=innerWidth; if(els) layout(); },350);
});

applyConfig();
init();
</script></body></html>
