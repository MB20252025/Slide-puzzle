<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Weighing Scale — Whitby Bookcase</title>
<style>
:root{
  --frame: 16px;
  --gold: #d9b26a;
  --gold-bright: #f4dda6;
}
*{ box-sizing:border-box; }
html,body{
  margin:0; height:100%; overflow:hidden;
  background:#070504;
  font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  color:#e6d9bd;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}

/* ============ STAGE ============ */
.stage{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:10px; padding:10px;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(84,54,24,.32) 0%, rgba(10,7,4,0) 62%),
    radial-gradient(ellipse at 50% 120%, rgba(120,80,30,.18) 0%, rgba(0,0,0,0) 60%),
    #070504;
}

/* ============ HUD ============ */
.hud{ text-align:center; flex:0 0 auto; }
.hud h1{
  margin:0;
  font-size:clamp(12px,3.2vw,16px);
  letter-spacing:.32em; text-transform:uppercase; font-weight:400;
  color:var(--gold);
  text-shadow:0 0 20px rgba(217,178,106,.35);
}
.hud p{
  margin:5px 0 0;
  font-size:clamp(9px,2.2vw,11px);
  letter-spacing:.08em; color:#8d7c60; font-style:italic;
}
.slots{ display:flex; gap:8px; justify-content:center; margin-top:8px; }
.slot{
  width:38px; height:38px; border-radius:9px;
  border:1px solid rgba(160,124,70,.32);
  background:rgba(20,14,8,.75);
  box-shadow:inset 0 0 14px rgba(0,0,0,.9);
  display:flex; align-items:center; justify-content:center;
  transition:border-color .45s ease, box-shadow .45s ease, background .45s ease;
}
.slot svg{
  width:80%; height:80%; opacity:.13;
  transform:scale(.6); transition:opacity .45s ease, transform .5s cubic-bezier(.2,1.6,.4,1);
}
.slot.filled{ border-color:rgba(232,196,124,.85); background:rgba(62,42,16,.8);
  box-shadow:inset 0 0 16px rgba(255,200,120,.16), 0 0 20px rgba(220,170,90,.30); }
.slot.filled svg{ opacity:1; transform:scale(1); }

/* ============ CABINET ============ */
.cabinet{
  position:relative; flex:0 0 auto;
  padding:var(--frame);
  border-radius:10px;
  background:
    repeating-linear-gradient(93deg,
      rgba(0,0,0,.20) 0 2px,
      rgba(255,255,255,.018) 2px 5px,
      rgba(0,0,0,0) 5px 14px),
    repeating-linear-gradient(88deg,
      rgba(0,0,0,.12) 0 1px,
      rgba(255,255,255,.012) 1px 21px),
    linear-gradient(158deg,#5e3d21 0%,#452a13 28%,#2e1a0b 62%,#180d05 100%);
  box-shadow:
    0 0 0 2px #120904,
    0 0 0 3px rgba(150,110,60,.16),
    0 26px 60px rgba(0,0,0,.9),
    0 8px 22px rgba(0,0,0,.7),
    inset 0 2px 0 rgba(255,214,150,.10),
    inset 0 -4px 12px rgba(0,0,0,.75);
}

.board{
  position:relative;
  height:min(62vh, 520px);
  aspect-ratio:4 / 10;
  border-radius:3px;
  overflow:hidden;
  background:
    repeating-linear-gradient(90deg,
      rgba(255,255,255,.012) 0 1px,
      rgba(0,0,0,0) 1px 9px),
    radial-gradient(ellipse at 50% 8%, #2b1c0f 0%, #150d06 48%, #090502 100%);
  box-shadow:
    inset 0 0 64px rgba(0,0,0,.98),
    inset 0 0 0 2px #0c0703,
    inset 0 0 0 3px rgba(120,88,48,.14);
  touch-action:none;
}

.layer{ position:absolute; inset:0; }

/* ============ EXIT ============ */
.exit{
  position:absolute; right:0;
  top:40%;            /* row 4 of 10 */
  height:10%;         /* one row */
  width:10%;
  border-radius:3px 0 0 3px;
  background:#080503;
  box-shadow:inset 0 0 12px #000, inset 0 0 0 1px #2c1c0c;
  overflow:hidden; z-index:1;
  transition:background .6s ease, box-shadow .6s ease;
}
.exit .bars{
  position:absolute; inset:0;
  background:repeating-linear-gradient(0deg,
    rgba(190,150,86,.55) 0 2px, transparent 2px 9px);
  transition:opacity .6s ease;
}
.exit .glow{
  position:absolute; inset:0; opacity:0;
  background:radial-gradient(ellipse at 15% 50%,
    rgba(255,216,152,.95), rgba(200,140,60,.4) 48%, transparent 80%);
  transition:opacity .6s ease;
}
.exit.open{
  background:#1a0f05;
  box-shadow:0 0 30px rgba(255,200,120,.55), inset 0 0 22px rgba(255,205,140,.4);
}
.exit.open .bars{ opacity:0; }
.exit.open .glow{ opacity:1; }

/* ============ BLOCKS ============ */
.block{
  position:absolute;
  display:flex; padding:2px; z-index:2;
  cursor:grab;
  transition:left .17s cubic-bezier(.34,.85,.4,1), top .17s cubic-bezier(.34,.85,.4,1);
  will-change:left,top;
}
.block.h{ flex-direction:row; }
.block.v{ flex-direction:column; }

.block.dragging{
  transition:none; cursor:grabbing; z-index:6;
  filter:brightness(1.14);
}
.block.target{ z-index:3; }

.block.selected::after{
  content:''; position:absolute; inset:-2px; border-radius:5px;
  border:1px solid rgba(230,190,120,.5);
  box-shadow:0 0 16px rgba(230,190,120,.32);
  pointer-events:none;
}

.block.denied{ animation:shake .32s ease; }
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  25%    { transform:translateX(-4px); }
  75%    { transform:translateX(4px); }
}

.block.escaping{
  transition:left .95s cubic-bezier(.5,0,.6,1), opacity .45s ease .55s;
  z-index:9; pointer-events:none;
}

/* ============ BOOKS ============ */
.book{
  position:relative; flex:1 1 0; min-width:0; min-height:0;
  border-radius:2px; overflow:hidden;
  background:linear-gradient(90deg, var(--c2) 0%, var(--c1) 16%, var(--c1) 84%, var(--c2) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.55),
    inset -2px 0 5px rgba(0,0,0,.5),
    inset 2px 0 3px rgba(255,255,255,.05),
    0 1px 3px rgba(0,0,0,.6);
}
.block.h .book + .book{ margin-left:1px; }
.block.v .book{
  background:linear-gradient(180deg, var(--c2) 0%, var(--c1) 16%, var(--c1) 84%, var(--c2) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.55),
    inset 0 -2px 5px rgba(0,0,0,.5),
    inset 0 2px 3px rgba(255,255,255,.05),
    0 1px 3px rgba(0,0,0,.6);
}
.block.v .book + .book{ margin-top:1px; }

.book .bands{
  position:absolute; inset:7% 10%; opacity:.85; pointer-events:none;
  background:repeating-linear-gradient(180deg,
    transparent 0 13%, rgba(226,194,128,.42) 13% 15%, transparent 15% 28%);
}
.block.v .book .bands{
  inset:12% 6%;
  background:repeating-linear-gradient(90deg,
    transparent 0 13%, rgba(226,194,128,.42) 13% 15%, transparent 15% 28%);
}
.book .label{
  position:absolute; left:16%; right:16%; top:34%; height:26%;
  border-radius:1px; pointer-events:none;
  border:1px solid rgba(226,194,128,.30);
  background:rgba(0,0,0,.30);
  box-shadow:inset 0 0 8px rgba(0,0,0,.7);
}
.block.v .book .label{ left:30%; right:30%; top:22%; height:56%; }

.block.target .book{
  background:linear-gradient(90deg,#5c3f10 0%,#b8913f 14%,#f0d79c 48%,#c9a34e 84%,#5c3f10 100%);
  box-shadow:
    inset 0 0 0 1px rgba(60,40,10,.7),
    inset -2px 0 6px rgba(0,0,0,.35),
    inset 2px 0 4px rgba(255,255,255,.18),
    0 0 18px rgba(240,205,130,.38);
}
.block.target .book .bands{
  background:repeating-linear-gradient(180deg,
    transparent 0 13%, rgba(90,62,20,.55) 13% 15%, transparent 15% 28%);
}
.block.target .book .label{
  border-color:rgba(90,62,20,.6);
  background:rgba(60,40,10,.35);
  box-shadow:inset 0 0 8px rgba(60,40,10,.6);
}

/* ============ COLLECTIBLES ============ */
.collectible{
  position:absolute; width:12%; aspect-ratio:1/1;
  transform:translate(-50%,-50%) scale(.15) rotate(-28deg);
  opacity:0; pointer-events:none; z-index:5; cursor:pointer;
  filter:drop-shadow(0 0 10px rgba(255,208,130,.65));
  transition:opacity .45s ease, transform .55s cubic-bezier(.2,1.6,.4,1);
}
.collectible svg{ width:100%; height:100%; display:block; }
.collectible.shown{
  opacity:1; pointer-events:auto;
  transform:translate(-50%,-50%) scale(1) rotate(0deg);
}
.collectible.shown::before{
  content:''; position:absolute; inset:-14%; border-radius:50%;
  background:radial-gradient(circle, rgba(255,206,130,.32), transparent 68%);
  animation:pulseGlow 2.1s ease-in-out infinite; pointer-events:none;
}
@keyframes pulseGlow{
  0%,100%{ opacity:.42; transform:scale(.88); }
  50%    { opacity:.95; transform:scale(1.14); }
}
.collectible.collected{
  opacity:0; pointer-events:none;
  transform:translate(-50%,-50%) scale(1.9);
  transition:opacity .35s ease, transform .4s ease;
}

/* ============ FOOTER ============ */
.foot{ flex:0 0 auto; }
.foot button{
  font-family:inherit; font-size:10px; letter-spacing:.26em;
  text-transform:uppercase; color:var(--gold);
  background:rgba(20,14,8,.8);
  border:1px solid rgba(160,124,70,.45);
  border-radius:40px; padding:9px 22px; cursor:pointer;
  transition:background .2s ease, border-color .2s ease, color .2s ease;
}
.foot button:hover{
  background:rgba(80,54,20,.9);
  border-color:rgba(232,196,124,.8);
  color:var(--gold-bright);
}

/* ============ WIN ============ */
.win{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(4,2,1,.88);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  opacity:0; pointer-events:none; transition:opacity .6s ease;
  z-index:200; padding:20px;
}
.win.show{ opacity:1; pointer-events:auto; }
.win-card{
  max-width:340px; text-align:center; padding:32px 26px;
  border-radius:12px; border:1px solid rgba(180,140,80,.4);
  background:
    radial-gradient(ellipse at 50% 0%, rgba(90,60,24,.55), rgba(14,9,5,.95) 70%),
    #0d0804;
  box-shadow:0 0 60px rgba(220,170,90,.18), inset 0 1px 0 rgba(255,220,160,.12);
  transform:translateY(14px) scale(.96);
  transition:transform .6s cubic-bezier(.2,1.3,.4,1);
}
.win.show .win-card{ transform:translateY(0) scale(1); }
.win-card h2{
  margin:0 0 10px; font-size:15px; letter-spacing:.3em;
  text-transform:uppercase; font-weight:400; color:var(--gold-bright);
  text-shadow:0 0 22px rgba(240,205,130,.5);
}
.win-card p{
  margin:0 0 22px; font-size:12px; font-style:italic;
  letter-spacing:.06em; color:#a08e6d; line-height:1.6;
}
.win-card button{
  font-family:inherit; font-size:10px; letter-spacing:.28em;
  text-transform:uppercase; color:#1a1008;
  background:linear-gradient(180deg,#e8c98a,#b8913f);
  border:none; border-radius:40px; padding:12px 28px;
  cursor:pointer; font-weight:700;
  box-shadow:0 6px 20px rgba(200,150,70,.3);
  transition:transform .18s ease, box-shadow .18s ease;
}
.win-card button:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 26px rgba(220,170,90,.45);
}
</style>
</head>
<body>

<div class="stage">

  <header class="hud">
    <h1>The Weighing Scale</h1>
    <p>Recover the three brass parts, then clear the ledger's path.</p>
    <div class="slots">
      <div class="slot" data-part="pan"></div>
      <div class="slot" data-part="beam"></div>
      <div class="slot" data-part="weight"></div>
    </div>
  </header>

  <div class="cabinet">
    <div class="board" id="board">
      <div class="exit" id="exit">
        <div class="glow"></div>
        <div class="bars"></div>
      </div>
      <div class="layer" id="blocksLayer"></div>
      <div class="layer" id="collectLayer"></div>
    </div>
  </div>

  <footer class="foot">
    <button id="resetBtn" type="button">Reset Case</button>
  </footer>

</div>

<div class="win" id="winOverlay">
  <div class="win-card">
    <h2>The Scale Is Whole</h2>
    <p>The brass settles. The ledger slides free — and the vault beyond it opens.</p>
    <button id="winBtn" type="button">Continue</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     BOARD: 4 columns x 10 rows.  Exit on the right at row 4.
     ============================================================ */
  const COLS = 4;
  const ROWS = 10;
  const EXIT_ROW = 4;

  /* Book spine colour pairs (light, dark) */
  const PALETTE = [
    ['#7d2d24','#3a110d'], ['#28492f','#102218'], ['#463a68','#20182f'],
    ['#6d4a1e','#31200a'], ['#22405e','#0e1d2c'], ['#5a3220','#28130a'],
    ['#3f3b2c','#1b1810'], ['#6a2f47','#301222'], ['#2f4a4a','#132222'],
    ['#5c2a5c','#281228']
  ];

  /* ------------------------------------------------------------
     LEVEL — 4 cols x 10 rows.  Exit at row 4 on the right edge.
     T = the brass ledger (must reach the exit).
     G / C / E each hide one brass part; move them to reveal it.
     ------------------------------------------------------------ */
  const LEVEL = [
    /* top filler rows (static) */
    { id:'P', r:0, c:0, w:2, h:1, seed:10 },
    { id:'Q', r:0, c:2, w:2, h:1, seed:11 },
    { id:'R', r:1, c:0, w:2, h:1, seed:12 },
    { id:'S', r:1, c:2, w:2, h:1, seed:13 },

    /* puzzle rows */
    { id:'A', r:2, c:0, w:2, h:1, seed:2 },               // fixed top-left
    { id:'B', r:2, c:2, w:1, h:2, seed:4 },               // vertical stack
    { id:'C', r:3, c:3, w:1, h:2, seed:5 },               // hides the BEAM
    { id:'T', r:4, c:0, w:2, h:1, target:true, seed:0 },  // TARGET (exit row)
    { id:'G', r:4, c:2, w:1, h:2, seed:6 },               // hides the PAN
    { id:'D', r:5, c:0, w:1, h:2, seed:7 },               // fixed left weight
    { id:'E', r:5, c:3, w:1, h:2, seed:8 },               // hides the WEIGHT
    { id:'F', r:7, c:0, w:2, h:1, seed:9 },               // mid filler

    /* bottom filler rows (static) */
    { id:'U', r:8, c:0, w:2, h:1, seed:14 },
    { id:'V', r:8, c:2, w:2, h:1, seed:15 },
    { id:'W', r:9, c:0, w:2, h:1, seed:16 },
    { id:'X', r:9, c:2, w:2, h:1, seed:17 }
  ];

  /* Hidden brass parts — each covered by a movable block at start */
  const PARTS = [
    { id:'pan',    r:4, c:2 },   // behind G
    { id:'beam',   r:4, c:3 },   // behind C
    { id:'weight', r:5, c:3 }    // behind E
  ];

  const PART_SVG = {
    pan: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
         '<line x1="50" y1="16" x2="50" y2="56" stroke="#f4dda6" stroke-width="3"/>' +
         '<line x1="28" y1="16" x2="72" y2="16" stroke="#f4dda6" stroke-width="3" stroke-linecap="round"/>' +
         '<circle cx="50" cy="16" r="4" fill="#f4dda6"/>' +
         '<ellipse cx="50" cy="66" rx="32" ry="9" fill="#a8842f" stroke="#f4dda6" stroke-width="3"/>' +
         '<ellipse cx="50" cy="62" rx="27" ry="7" fill="#e8c98a"/>' +
         '<path d="M18 66 Q18 84 50 84 Q82 84 82 66" fill="none" stroke="#f4dda6" stroke-width="4" stroke-linecap="round"/>' +
         '</svg>',
    beam: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M50 22 L42 76 L58 76 Z" fill="#8a6a2a" stroke="#f4dda6" stroke-width="3" stroke-linejoin="round"/>' +
          '<rect x="12" y="26" width="76" height="7" rx="3.5" fill="#c9a34e" stroke="#f4dda6" stroke-width="2.5"/>' +
          '<circle cx="50" cy="30" r="7" fill="#e8c98a" stroke="#f4dda6" stroke-width="2.5"/>' +
          '<line x1="16" y1="33" x2="24" y2="52" stroke="#f4dda6" stroke-width="2" stroke-linecap="round"/>' +
          '<line x1="84" y1="33" x2="76" y2="52" stroke="#f4dda6" stroke-width="2" stroke-linecap="round"/>' +
          '</svg>',
    weight: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
            '<path d="M36 30 Q36 16 50 16 Q64 16 64 30 L68 74 Q68 84 50 84 Q32 84 32 74 Z" fill="#8a6a2a" stroke="#f4dda6" stroke-width="3" stroke-linejoin="round"/>' +
            '<path d="M40 36 Q40 26 50 26 Q60 26 60 36 L63 68 Q63 76 50 76 Q37 76 37 68 Z" fill="#c9a34e"/>' +
            '<circle cx="50" cy="22" r="6" fill="none" stroke="#f4dda6" stroke-width="3"/>' +
            '</svg>'
  };

  /* ============================================================ */
  const board        = document.getElementById('board');
  const blocksLayer  = document.getElementById('blocksLayer');
  const collectLayer = document.getElementById('collectLayer');
  const exitEl       = document.getElementById('exit');
  const winOverlay   = document.getElementById('winOverlay');

  let blocks = [];
  let parts  = [];
  let selectedId = null;
  let drag = null;
  let won = false;
  let escaping = false;

  /* ---------- helpers ---------- */
  function colorsFor(n, seed) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(PALETTE[(seed + i * 3) % PALETTE.length]);
    return out;
  }

  function occupancy() {
    const g = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    blocks.forEach(b => {
      if (b.escaped) return;
      for (let r = b.r; r < b.r + b.h; r++)
        for (let c = b.c; c < b.c + b.w; c++)
          if (r >= 0 && r < ROWS && c >= 0 && c < COLS) g[r][c] = b.id;
    });
    return g;
  }

  function allPartsCollected() {
    return parts.every(p => p.collected);
  }

  /* ---------- build ---------- */
  function build() {
    blocks = LEVEL.map(b => Object.assign({}, b));
    parts  = PARTS.map(p => Object.assign({ collected:false, shown:false }, p));
    selectedId = null;
    drag = null;
    won = false;
    escaping = false;

    blocksLayer.innerHTML = '';
    collectLayer.innerHTML = '';
    winOverlay.classList.remove('show');
    exitEl.classList.remove('open');

    /* slots */
    document.querySelectorAll('.slot').forEach(s => {
      s.classList.remove('filled');
      s.innerHTML = PART_SVG[s.dataset.part] || '';
    });

    /* blocks */
    blocks.forEach(b => {
      const el = document.createElement('div');
      el.className = 'block ' + (b.w > b.h ? 'h' : 'v') + (b.target ? ' target' : '');
      el.dataset.id = b.id;
      el.style.left   = (b.c / COLS * 100) + '%';
      el.style.top    = (b.r / ROWS * 100) + '%';
      el.style.width  = (b.w / COLS * 100) + '%';
      el.style.height = (b.h / ROWS * 100) + '%';

      const count = b.w * b.h;
      const cols  = colorsFor(count, b.seed);
      for (let i = 0; i < count; i++) {
        const bk = document.createElement('div');
        bk.className = 'book';
        bk.style.setProperty('--c1', cols[i][0]);
        bk.style.setProperty('--c2', cols[i][1]);
        bk.innerHTML = '<div class="bands"></div><div class="label"></div>';
        el.appendChild(bk);
      }
      blocksLayer.appendChild(el);
      b.el = el;
    });

    /* hidden parts */
    parts.forEach(p => {
      const el = document.createElement('div');
      el.className = 'collectible';
      el.dataset.part = p.id;
      el.style.left = ((p.c + 0.5) / COLS * 100) + '%';
      el.style.top  = ((p.r + 0.5) / ROWS * 100) + '%';
      el.innerHTML  = PART_SVG[p.id];
      el.addEventListener('click', e => {
        e.stopPropagation();
        collectPart(p);
      });
      collectLayer.appendChild(el);
      p.el = el;
    });

    refreshReveals();
  }

  /* ---------- movement ---------- */
  function canMove(b, dr, dc) {
    const nr = b.r + dr;
    const nc = b.c + dc;
    if (nr < 0 || nc < 0 || nr + b.h > ROWS || nc + b.w > COLS) return false;
    const occ = occupancy();
    for (let r = nr; r < nr + b.h; r++)
      for (let c = nc; c < nc + b.w; c++)
        if (occ[r][c] && occ[r][c] !== b.id) return false;
    return true;
  }

  function place(b) {
    b.el.style.left = (b.c / COLS * 100) + '%';
    b.el.style.top  = (b.r / ROWS * 100) + '%';
  }

  function deny(b) {
    b.el.classList.remove('denied');
    void b.el.offsetWidth;
    b.el.classList.add('denied');
    setTimeout(() => b.el.classList.remove('denied'), 340);
  }

  function tryMove(b, dr, dc) {
    if (!b || b.escaped || escaping) return false;

    /* target trying to leave through the exit */
    if (b.target && dc === 1 && b.r === EXIT_ROW && b.c + b.w === COLS) {
      if (!allPartsCollected()) { deny(b); return false; }
      escapeTarget(b);
      return true;
    }

    if (!canMove(b, dr, dc)) { deny(b); return false; }

    b.r += dr;
    b.c += dc;
    place(b);
    b.el.classList.add('dragging');
    setTimeout(() => b.el.classList.remove('dragging'), 180);
    refreshReveals();
    return true;
  }

  function escapeTarget(b) {
    escaping = true;
    b.escaped = true;
    b.el.classList.add('escaping');
    requestAnimationFrame(() => {
      b.el.style.left = '104%';
      b.el.style.opacity = '0';
    });
    setTimeout(() => {
      b.el.remove();
      win();
    }, 1000);
  }

  /* ---------- hidden parts ---------- */
  function refreshReveals() {
    const occ = occupancy();
    parts.forEach(p => {
      if (p.collected) return;
      const covered = !!occ[p.r][p.c];
      if (!covered && !p.shown) {
        p.shown = true;
        p.el.classList.add('shown');
      }
    });
  }

  function collectPart(p) {
    if (p.collected) return;
    p.collected = true;
    p.el.classList.add('collected');
    const slot = document.querySelector('.slot[data-part="' + p.id + '"]');
    if (slot) slot.classList.add('filled');
    if (allPartsCollected()) exitEl.classList.add('open');
  }

  /* ---------- win ---------- */
  function win() {
    if (won) return;
    won = true;
    setTimeout(() => winOverlay.classList.add('show'), 300);
  }

  /* ============================================================
     INPUT — drag to slide blocks; tap to select, arrows to move
     ============================================================ */

  function blockFromEvent(e) {
    const el = e.target.closest('.block');
    if (!el) return null;
    return blocks.find(x => x.id === el.dataset.id) || null;
  }

  function select(b) {
    blocks.forEach(x => x.el.classList.toggle('selected', x === b));
    selectedId = b ? b.id : null;
  }

  blocksLayer.addEventListener('pointerdown', e => {
    if (won || escaping) return;
    const b = blockFromEvent(e);
    if (!b || b.escaped) return;

    select(b);
    b.el.classList.add('dragging');

    drag = {
      b: b,
      startX: e.clientX,
      startY: e.clientY,
      pointerId: e.pointerId
    };

    e.preventDefault();
  });

  window.addEventListener('pointermove', e => {
    if (!drag) return;

    const rect  = board.getBoundingClientRect();
    const cellW = rect.width  / COLS;
    const cellH = rect.height / ROWS;

    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;

    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > cellW * 0.42) {
        const dir = dx > 0 ? 1 : -1;
        tryMove(drag.b, 0, dir);
        drag.startX = e.clientX;
        drag.startY = e.clientY;
      }
    } else {
      if (Math.abs(dy) > cellH * 0.42) {
        const dir = dy > 0 ? 1 : -1;
        tryMove(drag.b, dir, 0);
        drag.startX = e.clientX;
        drag.startY = e.clientY;
      }
    }

    e.preventDefault();
  });

  window.addEventListener('pointerup', () => {
    if (drag) {
      drag.b.el.classList.remove('dragging');
      drag = null;
    }
  });
  window.addEventListener('pointercancel', () => {
    if (drag) {
      drag.b.el.classList.remove('dragging');
      drag = null;
    }
  });

  window.addEventListener('keydown', e => {
    if (won || escaping) return;
    if (!selectedId) return;
    const b = blocks.find(x => x.id === selectedId);
    if (!b || b.escaped) return;

    let handled = true;
    switch (e.key) {
      case 'ArrowLeft':  tryMove(b, 0, -1); break;
      case 'ArrowRight': tryMove(b, 0,  1); break;
      case 'ArrowUp':    tryMove(b, -1, 0); break;
      case 'ArrowDown':  tryMove(b,  1, 0); break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (escaping) return;
    build();
  });
  document.getElementById('winBtn').addEventListener('click', () => {
    winOverlay.classList.remove('show');
    build();
  });

  build();

})();
</script>
</body>
  </html>
